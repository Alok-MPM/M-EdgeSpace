<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M-EDGESPACE — 3D Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="wrap">
 <video id="vid" playsinline autoplay muted></video>
 <canvas id="cv3"></canvas>
 <canvas id="cv"></canvas>
 <div id="labels"></div>
 <div id="topbar"><span id="pname">📁 —</span><span id="saveDot">💾</span><button id="pbtn">📁</button></div>
 <div id="hud"></div>
 <button id="mbtn" onclick="var m=document.getElementById('menu');var o=m.style.display==='block';m.style.display=o?'none':'block';m.style.transform='none';m.style.opacity='1'">⚙️</button>
 <button id="bbtn" title="Focus mode">🌑</button>
 <div id="chat"><div id="chatLog"></div><input id="cmd" placeholder="command likho… (Enter)"></div>
 <div id="chips">
  <button data-c="cube lao">🧊 cube</button><button data-c="sphere banao">⚪ sphere</button>
  <button data-c="bottle banao">🍶 bottle</button><button data-c="ghumao 45 degree">🔄 45°</button>
  <button data-c="bada karo">➕ size</button><button data-c="laal karo">🎨 laal</button>
  <button data-c="labels">🏷️ labels</button><button data-c="copy karo">📋 copy</button>
  <button data-c="paste karo">📥 paste</button><button data-c="undo karo">↩ undo</button>
  <button data-c="sab saaf">🧹</button>
 </div>
 <div id="toast"></div>
 <aside id="menu" style="display:none">
  <b style="color:#0ff;font-size:15px">⚙️ OPTIONS</b>
  <label>Skeleton Points <input type="checkbox" data-o="skeleton" checked></label>
  <label style="flex-direction:column;align-items:stretch;gap:4px">Hand Display
   <select id="handMode"><option value="skeleton">Skeleton Lines</option><option value="hologram">Hologram Hand (blue)</option><option value="both">Both</option></select></label>
  <label>Holo-Vision Mode <input type="checkbox" data-o="holo"></label>
  <label>Head Control (nod/shake) <input type="checkbox" data-o="head" checked></label>
  <label>Perf Mode (no filters) <input type="checkbox" data-o="perf"></label>
  <button id="bLabel">🏷️ Label Mode ON/OFF</button>
  <button id="bGltf">📦 GLTF Model Import</button>
  <button id="bClear">🧹 Sab 3D Objects Hatao</button>
  <button id="bSave">📸 Photo Save Karo</button>
  <div style="opacity:.6;font-size:11px;line-height:1.6">
   🌑 Focus = black studio (sirf hands + 3D objects)<br>
   GESTURES: 👉hold=select+drag-rotate • 🤏pinch=size • 🖐palm=move • ✊hold=delete • ✊flash=deselect • 👉👉obj=morph • 👉👉khali=cube spawn • ↩ undo</div>
 </aside>
 <div id="ppanel" style="display:none">
  <b style="color:#0ff;font-size:15px">📁 PROJECTS</b>
  <div class="row"><input id="npName" placeholder="project naam (optional)"><button id="pNew">➕ Naya</button></div>
  <div class="row">
   <button id="pImp">📥 Import JSON</button>
   <button id="pExp">📤 Export</button>
   <button id="pDelAll" class="danger">🗑 Sab Delete</button>
   <button id="pClose">✖ Band</button>
  </div>
  <div id="pGrid"></div>
 </div>
 <div id="home">
  <h1>M-EDGESPACE</h1>
  <p style="opacity:.6;font-size:20px">Meri Maiya 🌸 • 3D Studio</p>
  <button id="camBtn">🎥 CAMERA START KARO</button>
  <div id="stat"></div>
 </div>
</div>
<script>
setTimeout(()=>{const miss=[];if(!window.APP1_OK)miss.push('app1.js');if(!window.APP2_OK)miss.push('app2.js');if(!window.S3D_OK)miss.push('studio3d.js');
 if(miss.length){const d=document.getElementById('stat');if(d)d.textContent='❌ load nahi hua: '+miss.join(', ')+' — reload karo'}},6000);
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script src="./app1.js"></script>
<script src="./mes.js"></script>
<script src="./app2.js"></script>
<script src="./projects.js"></script>
<script type="module" src="./studio3d.js"></script>
</body>
</html>
