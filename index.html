<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-EDGESPACE — 3D Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05060a;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{position:fixed;inset:0;transition:filter .09s}
#wrap.focus{background:radial-gradient(circle at 50% 45%,#0c1622 0%,#04060a 72%)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#labels{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}
.lbl{position:absolute;background:#000c;border:1px solid #0ff8;color:#aff;font:10px Consolas,monospace;
 padding:2px 6px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
#hud{position:absolute;top:44px;left:10px;z-index:5;color:#cfe;font:600 11px/1.5 Consolas,monospace;opacity:.7;text-shadow:0 0 6px #000;white-space:pre}
#topbar{position:absolute;top:8px;left:10px;z-index:6;display:flex;gap:8px;align-items:center;color:#aff;font:700 13px Consolas,monospace;text-shadow:0 0 8px #000}
#saveDot{opacity:.25;transition:.3s}
#pbtn{border:1px solid #0ff6;background:#0009;color:#0ff;border-radius:10px;padding:4px 10px;font-size:15px;cursor:pointer}
#mbtn{position:absolute;top:8px;right:10px;z-index:8;border:1px solid #0ff6;background:#0009;color:#0ff;font-size:18px;border-radius:10px;padding:6px 10px;cursor:pointer}
#bbtn{position:absolute;top:8px;right:56px;z-index:8;border:1px solid #fff3;background:#0009;color:#fff;font-size:18px;border-radius:10px;padding:6px 10px;cursor:pointer}
#chat{position:absolute;bottom:52px;left:12px;z-index:6;width:210px;height:40px;background:#000c;
 border:1px solid #0ff5;border-radius:12px;overflow:hidden;transition:width .25s,height .25s;display:flex;flex-direction:column}
#chat.open{width:min(370px,92vw);height:46vh}
#chatLog{display:none;flex:1;overflow:auto;padding:8px;gap:6px;flex-direction:column}
#chat.open #chatLog{display:flex}
.msg{max-width:85%;padding:6px 10px;border-radius:10px;font:12px/1.45 Consolas,monospace;color:#dff;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#0ff3;border:1px solid #0ff4}
.msg.a{align-self:flex-start;background:#ffffff14;border:1px solid #ffffff22}
.msg.s{align-self:center;background:none;border:none;opacity:.55;font-size:11px}
#cmd{border:none;background:#0000;color:#aff;font:13px Consolas,monospace;padding:10px 12px;outline:none}
#chips{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:95%}
#chips button{border:1px solid #fff4;background:#000a;color:#fff;font:600 12px Consolas,monospace;border-radius:999px;padding:6px 12px;cursor:pointer}
#toast{position:absolute;top:13%;left:50%;transform:translateX(-50%);background:#0ffd;color:#022;font:700 14px Consolas,monospace;padding:9px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#menu{position:absolute;top:0;right:0;bottom:0;width:250px;background:#000d;backdrop-filter:blur(8px);z-index:7;padding:14px;flex-direction:column;gap:9px;color:#cff;font:13px Consolas,monospace}
#menu label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#menu input{width:20px;height:20px;accent-color:#0ff}
#menu button{border:1px solid #0ff6;background:#0ff2;color:#aff;font:700 13px Consolas;border-radius:10px;padding:9px;cursor:pointer}
#handMode{background:#000a;color:#aff;border:1px solid #0ff5;border-radius:8px;padding:6px;font:11px Consolas;width:100%}
#ppanel{position:absolute;inset:0;z-index:9;background:#000c;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:#cff}
#pGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px;max-height:52vh;overflow:auto}
#npName{background:#000a;border:1px solid #0ff5;color:#aff;font:13px Consolas,monospace;border-radius:10px;padding:9px;outline:none;width:180px}
#ppanel .row button{border:1px solid #0ff6;background:#0ff2;color:#aff;font:700 13px Consolas;border-radius:10px;padding:9px 14px;cursor:pointer}
.card{background:#0ff1;border:1px solid #0ff4;border-radius:12px;padding:10px 14px;min-width:150px;color:#dff;font:12px Consolas,monospace;display:flex;flex-direction:column;gap:6px}
.card b{color:#aff;font-size:14px}.card span{opacity:.6}.card .row{display:flex;gap:6px}
.card button{border:1px solid #0ff5;background:#0ff2;color:#aff;border-radius:8px;padding:4px 8px;font:700 11px Consolas;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#112233 0%,#05060a 75%);color:#fff;text-align:center;padding:20px;overflow:auto}
#home h1{font-size:40px;letter-spacing:6px;background:linear-gradient(90deg,#0ff,#f0f,#0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#camBtn{border:none;border-radius:12px;padding:15px 38px;font:700 17px Consolas,monospace;color:#001;background:linear-gradient(90deg,#0ff,#7f5);box-shadow:0 0 25px #0ff8;cursor:pointer}
#stat{color:#f66;font:12px Consolas,monospace;min-height:16px}
</style>
</head>
<body>
<div id="wrap">
 <video id="vid" playsinline autoplay muted></video>
 <canvas id="cv3"></canvas>
 <canvas id="cv"></canvas>
 <div id="labels"></div>
 <div id="topbar"><span id="pname">📁 —</span><span id="saveDot">💾</span><button id="pbtn">📁</button></div>
 <div id="hud"></div>
 <button id="mbtn" onclick="var m=document.getElementById('menu');var o=m.style.display==='block';m.style.display=o?'none':'block';m.style.transform='none';m.style.opacity='1'">⚙️</button>
 <button id="bbtn" title="Focus mode">🌑</button>
 <div id="chat"><div id="chatLog"></div><input id="cmd" placeholder="command likho… (Enter)"></div>
 <div id="chips">
  <button data-c="cube lao">🧊 cube</button><button data-c="sphere banao">⚪ sphere</button>
  <button data-c="bottle banao">🍶 bottle</button><button data-c="ghumao 45 degree">🔄 45°</button>
  <button data-c="bada karo">➕ size</button><button data-c="laal karo">🎨 laal</button>
  <button data-c="naam dikhao">🏷️ labels</button><button data-c="copy karo">📋 copy</button>
  <button data-c="paste karo">📥 paste</button><button data-c="sab saaf">🧹</button>
 </div>
 <div id="toast"></div>
 <aside id="menu" style="display:none">
  <b style="color:#0ff;font-size:15px">⚙️ OPTIONS</b>
  <label>Skeleton Points <input type="checkbox" data-o="skeleton" checked></label>
  <label style="flex-direction:column;align-items:stretch;gap:4px">Hand Display
   <select id="handMode"><option value="skeleton">Skeleton Lines</option><option value="hologram">Hologram Hand (blue)</option><option value="both">Both</option></select></label>
  <label>Holo-Vision Mode <input type="checkbox" data-o="holo"></label>
  <label>Head Control (nod/shake) <input type="checkbox" data-o="head" checked></label>
  <label>Perf Mode (no filters) <input type="checkbox" data-o="perf"></label>
  <button id="bLabel">🏷️ Label Mode ON/OFF</button>
  <button id="bGltf">📦 GLTF Model Import</button>
  <button id="bClear">🧹 Sab 3D Objects Hatao</button>
  <button id="bSave">📸 Photo Save Karo</button>
  <div style="opacity:.6;font-size:11px;line-height:1.6">
   🌑 Focus = black studio (sirf hands + 3D objects, background gayab)<br>
   GESTURES: 👉hold=select+drag-rotate • 🤏pinch=size • 🖐palm=move • ✊hold=delete • ✊flash=deselect • 👉👉=morph<br>
   Voice = OFF (baad me). Chat/chips = local-ai.</div>
 </aside>
 <div id="ppanel" style="display:none">
  <b style="color:#0ff;font-size:15px">📁 PROJECTS</b>
  <div class="row"><input id="npName" placeholder="project naam (optional)"><button id="pNew">➕ Naya</button></div>
  <div class="row"><button id="pImp">📥 Import JSON</button><button id="pExp">📤 Export</button><button id="pClose">✖ Band</button></div>
  <div id="pGrid"></div>
 </div>
 <div id="home">
  <h1>M-EDGESPACE</h1>
  <p style="opacity:.6;font-size:20px">Meri Maiya 🌸 • 3D Studio</p>
  <button id="camBtn">🎥 CAMERA START KARO</button>
  <div id="stat"></div>
 </div>
</div>
<script>
setTimeout(()=>{const miss=[];if(!window.APP1_OK)miss.push('app1.js');if(!window.APP2_OK)miss.push('app2.js');if(!window.S3D_OK)miss.push('studio3d.js');
 if(miss.length){const d=document.getElementById('stat');if(d)d.textContent='❌ load nahi hua: '+miss.join(', ')+' — reload karo'}},6000);
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script src="./app1.js"></script>
<script src="./mes.js"></script>
<script src="./app2.js"></script>
<script type="module" src="./studio3d.js"></script>
</body>
</html>
